name: Pull Request

on:
  pull_request:
    paths:
      - "vault-agent/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-chart:
    name: Lint and template vault-agent chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Helm lint
        run: helm lint ./vault-agent

      - name: Helm template (default values)
        run: helm template test ./vault-agent

      - name: Helm template (multi-secret example values)
        run: |
          cat > /tmp/pr-values.yaml << 'EOF'
          vaultAgent:
            secrets:
              - name: appa
                secretPath: kv/data/appa/secret
                keys: [username, password]
                format: env
                outputFile: /vault/output/appa.env
              - name: appb
                secretPath: kv/data/appb/secret
                keys: [token]
                format: json
                outputFile: /vault/output/appb.json
          EOF
          helm template test ./vault-agent -f /tmp/pr-values.yaml
